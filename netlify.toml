# Netlify — Vite portfolio
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Static files in publish dir (robots.txt, sitemap.xml, assets) are served
# before this SPA fallback applies.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
